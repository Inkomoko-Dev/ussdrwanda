# =============================================================================
#  Inkomoko USSD Client Self-Service Platform
#
#  Keep this file ASCII-only: .properties files are often read as ISO-8859-1.
#  Values written as ${ENV_VAR:default} can be overridden with environment
#  variables; set them for every non-local environment (never commit secrets).
# =============================================================================

spring.application.name=mobilebanking
server.port=${SERVER_PORT:9094}

# -----------------------------------------------------------------------------
# Database (PostgreSQL)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inkomoko_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Actuator / API docs
# -----------------------------------------------------------------------------
# Redis starter is on the classpath but not used yet, so keep it out of /actuator/health.
management.health.redis.enabled=false
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# -----------------------------------------------------------------------------
# USSD
# -----------------------------------------------------------------------------
# Dialled code, as digits separated by '*'. Pilot: 662*105 (*662*105# on the
# Efashe shortcode). Switch to 311 once Inkomoko's *311# shortcode is configured.
# The gateway's serviceCode (e.g. "RW|MTN|662|105") must match this value.
inkomoko.ussd.service-code=${USSD_SERVICE_CODE:662*105}
# Inactivity window (seconds) after which an open session is treated as expired.
inkomoko.ussd.session-timeout-seconds=60
inkomoko.ussd.max-pin-attempts=3
inkomoko.ussd.pin-length=4
inkomoko.ussd.max-response-length=182
inkomoko.ussd.max-loans-listed=5
# Screen texts: defaults in i18n/ussd_<lang>.properties, portal overrides in the
# ussd_message table. Each node reloads the overrides this often (milliseconds).
inkomoko.messages.refresh-ms=60000

# -----------------------------------------------------------------------------
# Support / help text
# -----------------------------------------------------------------------------
# PLACEHOLDER: replace with Inkomoko's real helpline before UAT.
inkomoko.support.helpline=${SUPPORT_HELPLINE:+250 XXX XXX XXX}

# -----------------------------------------------------------------------------
# Loan repayment via Mobile Money
# -----------------------------------------------------------------------------
inkomoko.repayment.min-amount=500
inkomoko.repayment.max-amount=5000000
inkomoko.repayment.currency=RWF
# Block a second push to the same phone while one is still pending (minutes).
inkomoko.repayment.duplicate-window-minutes=5
# PENDING payments older than this are status-checked with the gateway (minutes).
inkomoko.repayment.pending-check-after-minutes=3
# PENDING payments still unresolved after this go to NEEDS_REVIEW (maker/checker).
inkomoko.repayment.pending-expiry-minutes=60
inkomoko.repayment.max-posting-attempts=5
inkomoko.repayment.reconciliation-interval-ms=60000

# -----------------------------------------------------------------------------
# Core banking: customer and loan data always comes from here (no demo data).
#   mode=omnichannel : (default) the Inkomoko Omnichannel API (inkomoko.omnichannel.*)
#   mode=live : the Fineract REST API directly (inkomoko.fineract.*)
# -----------------------------------------------------------------------------
inkomoko.fineract.mode=${FINERACT_MODE:omnichannel}
# The settings below are read only when FINERACT_MODE=live.
inkomoko.fineract.base-url=${FINERACT_BASE_URL:}
inkomoko.fineract.tenant-id=${FINERACT_TENANT_ID:default}
inkomoko.fineract.username=${FINERACT_USERNAME:}
inkomoko.fineract.password=${FINERACT_PASSWORD:}
# Fineract payment type id used for USSD/MoMo repayments (configure in Fineract admin).
inkomoko.fineract.payment-type-id=${FINERACT_PAYMENT_TYPE_ID:1}
inkomoko.fineract.connect-timeout-ms=3000
inkomoko.fineract.read-timeout-ms=8000

# -----------------------------------------------------------------------------
# Mobile Money collections (MTN MoMo / Airtel Money)
#   mode=omnichannel : (default) Omnichannel /ussd/payment/initiate; the Payment Hub
#               posts the repayment to core banking and Omnichannel sends the SMS.
#   mode=live : the Efashe merchant API (inkomoko.payment.*)
# -----------------------------------------------------------------------------
inkomoko.payment.mode=${PAYMENT_MODE:omnichannel}
# The settings below are read only when PAYMENT_MODE=live.
inkomoko.payment.base-url=${PAYMENT_BASE_URL:}
inkomoko.payment.api-key=${PAYMENT_API_KEY:}
inkomoko.payment.merchant-code=${PAYMENT_MERCHANT_CODE:INKOMOKO}
inkomoko.payment.callback-url=${PAYMENT_CALLBACK_URL:}
# Shared secret the gateway must send in the X-Callback-Token header; blank rejects every callback.
inkomoko.payment.callback-token=${PAYMENT_CALLBACK_TOKEN:}
inkomoko.payment.connect-timeout-ms=3000
inkomoko.payment.read-timeout-ms=10000

# -----------------------------------------------------------------------------
# Inkomoko Omnichannel API (FINERACT_MODE=omnichannel and/or PAYMENT_MODE=omnichannel)
#   Requests are signed with HMAC-SHA256; the secret is issued per partner by Inkomoko.
# -----------------------------------------------------------------------------
inkomoko.omnichannel.base-url=${OMNICHANNEL_BASE_URL:http://dev.inkomoko.com:1134/api/v1}
inkomoko.omnichannel.api-key=${OMNICHANNEL_API_KEY:fdi}
inkomoko.omnichannel.secret=${OMNICHANNEL_SECRET:}
inkomoko.omnichannel.channel=${OMNICHANNEL_CHANNEL:USSD}
inkomoko.omnichannel.connect-timeout-ms=3000
inkomoko.omnichannel.read-timeout-ms=15000

# -----------------------------------------------------------------------------
# SMS (Efashe SMS gateway)
#   mode=mock : messages are only logged
#   mode=live : sent with SMS_BASE_URL and SMS_API_KEY (GitLab: SMS_API_KEY_STAGING / SMS_API_KEY)
# -----------------------------------------------------------------------------
inkomoko.sms.mode=${SMS_MODE:mock}
inkomoko.sms.base-url=${SMS_BASE_URL:}
inkomoko.sms.api-key=${SMS_API_KEY:}
inkomoko.sms.sender-id=${SMS_SENDER_ID:INKOMOKO}

# -----------------------------------------------------------------------------
# Portal e-mail
#   mode=mock : the message is written to the log (local development)
#   mode=smtp : sent through MAIL_HOST. Used when a Super Administrator emails
#               the default sign-in password.
# -----------------------------------------------------------------------------
inkomoko.mail.mode=${MAIL_MODE:mock}
inkomoko.mail.from=${MAIL_FROM:noreply@inkomoko.example}
inkomoko.mail.host=${MAIL_HOST:}
inkomoko.mail.port=${MAIL_PORT:587}
inkomoko.mail.username=${MAIL_USERNAME:}
inkomoko.mail.password=${MAIL_PASSWORD:}
inkomoko.mail.starttls=${MAIL_STARTTLS:true}

# -----------------------------------------------------------------------------
# Admin portal (/portal) security
# -----------------------------------------------------------------------------
# HMAC secret for portal login tokens (JWT, HS256): at least 32 characters.
# The default is for local development only - set JWT_SECRET in every environment.
inkomoko.security.jwt-secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
# Super Administrator seeded on first start-up (only when no portal user exists yet).
# Sign in with username "admin" or this e-mail; the password must be changed at first sign-in.
# Override BOOTSTRAP_ADMIN_PASSWORD in every shared environment.
inkomoko.security.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@yopmail.com}
inkomoko.security.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@2026!}
inkomoko.security.bootstrap-admin-name=${BOOTSTRAP_ADMIN_NAME:System Administrator}
