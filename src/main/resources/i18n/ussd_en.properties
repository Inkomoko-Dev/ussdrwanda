# Inkomoko USSD texts - ENGLISH (reference bundle: every key must exist here).
#
# Rules (enforced by UssdMessageBundleTest):
#   * Same keys and same {placeholders} in every language file.
#   * GSM-7 characters only (no accents/curly quotes) - accents switch the SMS/USSD encoding.
#   * USSD screens (every key not starting with "sms.") fit in 182 characters with worst-case values.
#   * Placeholders are {name}; apostrophes need no escaping. Use \n for a line break.
# Portal overrides (per country) take precedence over these defaults at runtime.

