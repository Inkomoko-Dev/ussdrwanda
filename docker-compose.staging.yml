# Staging: host PostgreSQL on :5432 (network_mode: host). No DB container here.
# GitLab CI/CD variables use the _STAGING suffix; defaults mirror application.properties
# (core banking and payments use the Omnichannel API; SMS is live when SMS_API_KEY_STAGING is set;
# e-mail defaults to mock).
services:
  inkomoko-ussd:
    image: registry.gitlab.com/efashe2/efashe-wallet/inkomoko-ussd:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - registry.gitlab.com/efashe2/efashe-wallet/inkomoko-ussd:${IMAGE_TAG:-latest}
    environment:
      - SERVER_PORT=${APP_PORT:-8093}
      - TZ=Africa/Kigali
      - LOGGING_FILE_NAME=/opt/tomcat/logs/inkomoko-ussd.log
      # USSD code: 662*105 (pilot) -> 311 when Inkomoko's shortcode is live
      - USSD_SERVICE_CODE=${USSD_SERVICE_CODE_STAGING:-662*105}
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${DB_NAME_STAGING:-inkomoko_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME_STAGING:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD_STAGING:-postgres}
      # Support
      - SUPPORT_HELPLINE=${SUPPORT_HELPLINE_STAGING:-+250 XXX XXX XXX}
      # Core banking (clients, loans) and MoMo repayments: omnichannel (default) or live
      - FINERACT_MODE=${FINERACT_MODE_STAGING:-omnichannel}
      - PAYMENT_MODE=${PAYMENT_MODE_STAGING:-omnichannel}
      # Inkomoko Omnichannel API (staging)
      - OMNICHANNEL_BASE_URL=${OMNICHANNEL_BASE_URL_STAGING:-http://dev.inkomoko.com:1134/api/v1}
      - OMNICHANNEL_API_KEY=${OMNICHANNEL_API_KEY_STAGING:-fdi}
      - OMNICHANNEL_SECRET=${OMNICHANNEL_SECRET_STAGING:-}
      # Only read when FINERACT_MODE_STAGING=live (Fineract directly, bypassing Omnichannel)
      - FINERACT_BASE_URL=${FINERACT_BASE_URL_STAGING:-}
      - FINERACT_TENANT_ID=${FINERACT_TENANT_ID_STAGING:-default}
      - FINERACT_USERNAME=${FINERACT_USERNAME_STAGING:-}
      - FINERACT_PASSWORD=${FINERACT_PASSWORD_STAGING:-}
      - FINERACT_PAYMENT_TYPE_ID=${FINERACT_PAYMENT_TYPE_ID_STAGING:-1}
      # Only read when PAYMENT_MODE_STAGING=live (Efashe merchant API)
      - PAYMENT_BASE_URL=${PAYMENT_BASE_URL_STAGING:-}
      - PAYMENT_API_KEY=${PAYMENT_API_KEY_STAGING:-}
      - PAYMENT_MERCHANT_CODE=${PAYMENT_MERCHANT_CODE_STAGING:-INKOMOKO}
      - PAYMENT_CALLBACK_URL=${PAYMENT_CALLBACK_URL_STAGING:-}
      - PAYMENT_CALLBACK_TOKEN=${PAYMENT_CALLBACK_TOKEN_STAGING:-}
      # Portal e-mail (default-password delivery): mock logs only, smtp sends
      - MAIL_MODE=${MAIL_MODE_STAGING:-mock}
      - MAIL_FROM=${MAIL_FROM_STAGING:-noreply@inkomoko.example}
      - MAIL_HOST=${MAIL_HOST_STAGING:-}
      - MAIL_PORT=${MAIL_PORT_STAGING:-587}
      - MAIL_USERNAME=${MAIL_USERNAME_STAGING:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD_STAGING:-}
      # SMS: the deploy job sets SMS_MODE_STAGING=live when SMS_API_KEY_STAGING is provided
      - SMS_MODE=${SMS_MODE_STAGING:-mock}
      - SMS_BASE_URL=${SMS_BASE_URL_STAGING:-}
      - SMS_API_KEY=${SMS_API_KEY_STAGING:-}
      - SMS_SENDER_ID=${SMS_SENDER_ID_STAGING:-INKOMOKO}
      # Admin portal login tokens (JWT) - at least 32 characters
      - JWT_SECRET=${JWT_SECRET_STAGING:-staging-jwt-secret-change-me-please-0123456789}
      # Portal Super Administrator seeded on the first start of a new database (password change forced at first sign-in)
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL_STAGING:-admin@yopmail.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD_STAGING:-Admin@2026!}
    volumes:
      - /opt/tomcat/logs:/opt/tomcat/logs
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${SERVER_PORT:-8093}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    container_name: inkomoko-ussd-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
