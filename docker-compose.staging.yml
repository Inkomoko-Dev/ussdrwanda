# Staging: host PostgreSQL on :5432 (network_mode: host). No DB container here.
# GitLab CI/CD variables use the _STAGING suffix; defaults mirror application.properties
# (external integrations default to mock mode on staging).
services:
  inkomoko-ussd:
    image: registry.gitlab.com/efashe2/efashe-wallet/inkomoko-ussd:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - registry.gitlab.com/efashe2/efashe-wallet/inkomoko-ussd:${IMAGE_TAG:-latest}
    environment:
      - SERVER_PORT=${APP_PORT:-8093}
      - TZ=Africa/Kigali
      - LOGGING_FILE_NAME=/opt/tomcat/logs/inkomoko-ussd.log
      # USSD code: 662*105 (pilot) -> 311 when Inkomoko's shortcode is live
      - USSD_SERVICE_CODE=${USSD_SERVICE_CODE_STAGING:-662*105}
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${DB_NAME_STAGING:-inkomoko_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME_STAGING:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD_STAGING:-postgres}
      # Support
      - SUPPORT_HELPLINE=${SUPPORT_HELPLINE_STAGING:-+250 XXX XXX XXX}
      # Fineract
      - FINERACT_MODE=${FINERACT_MODE_STAGING:-demo}
      # Demo mode: phones registered as demo clients at startup (comma-separated);
      # add more at runtime with POST /api/admin/demo/clients
      - DEMO_ALLOWED_MSISDNS=${DEMO_ALLOWED_MSISDNS_STAGING:-250788683008,250785642275}
      - FINERACT_BASE_URL=${FINERACT_BASE_URL_STAGING:-https://fineract-sandbox.example/fineract-provider/api/v1}
      - FINERACT_TENANT_ID=${FINERACT_TENANT_ID_STAGING:-default}
      - FINERACT_USERNAME=${FINERACT_USERNAME_STAGING:-mifos}
      - FINERACT_PASSWORD=${FINERACT_PASSWORD_STAGING:-password}
      - FINERACT_PAYMENT_TYPE_ID=${FINERACT_PAYMENT_TYPE_ID_STAGING:-1}
      # Payment gateway (MoMo / Airtel Money)
      - PAYMENT_MODE=${PAYMENT_MODE_STAGING:-mock}
      - PAYMENT_BASE_URL=${PAYMENT_BASE_URL_STAGING:-https://payments.efashe.example/api/v1}
      - PAYMENT_API_KEY=${PAYMENT_API_KEY_STAGING:-CHANGE_ME}
      - PAYMENT_MERCHANT_CODE=${PAYMENT_MERCHANT_CODE_STAGING:-INKOMOKO}
      - PAYMENT_CALLBACK_URL=${PAYMENT_CALLBACK_URL_STAGING:-https://ussd.inkomoko.example/api/payments/callback}
      - PAYMENT_CALLBACK_TOKEN=${PAYMENT_CALLBACK_TOKEN_STAGING:-CHANGE_ME_CALLBACK_TOKEN}
      # SMS
      - SMS_MODE=${SMS_MODE_STAGING:-mock}
      - SMS_BASE_URL=${SMS_BASE_URL_STAGING:-https://sms.efashe.example/api/v1}
      - SMS_API_KEY=${SMS_API_KEY_STAGING:-CHANGE_ME}
      - SMS_SENDER_ID=${SMS_SENDER_ID_STAGING:-INKOMOKO}
    volumes:
      - /opt/tomcat/logs:/opt/tomcat/logs
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${SERVER_PORT:-8093}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    container_name: inkomoko-ussd-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
